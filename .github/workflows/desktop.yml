name: Desktop validation
on:
  workflow_dispatch:
    inputs:
      upload_release:
        description: Upload verified packages to the existing v0.1.0 draft release
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-15-intel
            target: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev
      - name: Install Electron runtime
        run: node node_modules/electron/install.js
      - run: npm test
        id: unit
      - run: npm run smoke
        id: smoke
      - run: npm run package:${{ matrix.target }}
        id: package
        if: always() && steps.unit.outcome == 'success'
      - uses: actions/upload-artifact@v4
        if: always() && steps.package.outcome == 'success'
        with:
          name: Profile-Studio-${{ matrix.target }}-x64
          path: artifacts/*
      - name: Upload release packages
        if: always() && steps.package.outcome == 'success' && github.event_name == 'workflow_dispatch' && inputs.upload_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v0.1.0 artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
